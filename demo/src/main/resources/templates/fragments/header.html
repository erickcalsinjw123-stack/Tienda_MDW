<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo, hojaEstilos)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:if="${hojaEstilos != null}" rel="stylesheet" th:href="@{${hojaEstilos}}">
</head>
<body>


<header th:fragment="menu">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary site-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <span class="brand-mark"><i class="bi bi-cpu"></i></span>
                <span>Tech<span class="brand-accent">Store</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/catalogo}">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contacto}">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link cart-link" th:href="@{/#productos}" id="btnCarrito"><i class="bi bi-cart3 me-1"></i>Carrito <span class="badge" id="contadorCarrito">0</span></a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/iniciarSesion}">Iniciar sesión</a></li>
                    <li class="nav-item ms-lg-2"><a class="btn btn-light btn-sm nav-register" th:href="@{/registro}">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<script th:src="@{/js/carrito.js}"></script>
</body>
</html>
