<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Registro - TechStore', '/css/index.css')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    
    <header th:replace="~{fragments/header :: menu}"></header>

    <main class="container py-5 flex-grow-1">
        
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus text-primary fs-1"></i>
                            <h1 class="h3 mt-2">Crear una cuenta</h1>
                            <p class="text-muted mb-0">Regístrate en TechStore</p>
                        </div>

                        <div id="alertaRegistro" class="alert d-none" role="alert"></div>

                        <form id="formRegistro">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" placeholder="Ingrese su apellido" required>
                                </div>
                                <div class="col-md-7">
                                    <label for="correo" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
                                </div>
                                <div class="col-md-5">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="tel" class="form-control" id="telefono" placeholder="999 999 999" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmar" class="form-label">Confirmar contraseña</label>
                                    <input type="password" class="form-control" id="confirmar" minlength="6" placeholder="Repita su contraseña" required>
                                </div>
                            </div>

                            <div class="form-check my-4">
                                <input class="form-check-input" type="checkbox" id="terminos" required>
                                <label class="form-check-label" for="terminos">Acepto los términos y condiciones.</label>
                            </div>

                            <div class="d-flex gap-2 flex-column flex-sm-row">
                                <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-person-plus me-2"></i>Registrarse</button>
                                <button type="reset" class="btn btn-outline-secondary flex-fill">Limpiar</button>
                            </div>
                        </form>

                        <p class="text-center mt-4 mb-0">¿Ya tienes una cuenta? <a th:href="@{/iniciarSesion}">Iniciar sesión</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: pie}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/autenticacion.js}"></script>
</body>
</html>
